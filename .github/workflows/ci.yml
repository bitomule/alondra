{
  "name": "Pull request checks",
  "on": {
    "pull_request": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "pr-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "CI": {
      "name": "CI",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "env": {
        "MUSTS_VERSION": "0.12.0",
        "MUSTS_SHA256": "f546bd6b06c6794db70e26076170f059f69cb448d187c1a5519a60424878c4c5",
        "GH_TOKEN": "${{ github.token }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Install the published musts binary",
          "run": "archive=musts-x86_64-unknown-linux-gnu.tar.xz\ngh release download \"musts-v${MUSTS_VERSION}\" --repo bitomule/musts --pattern \"$archive\" --dir \"$RUNNER_TEMP/musts\"\necho \"$MUSTS_SHA256  $RUNNER_TEMP/musts/$archive\" | sha256sum --check -\ntar -xJf \"$RUNNER_TEMP/musts/$archive\" -C \"$RUNNER_TEMP/musts\" --strip-components=1\necho \"$RUNNER_TEMP/musts\" >> \"$GITHUB_PATH\""
        },
        {
          "name": "Require every check to be validated for this tree",
          "run": "musts validate"
        }
      ]
    }
  }
}
