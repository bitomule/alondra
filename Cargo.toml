[workspace]
resolver = "3"
members = ["crates/agent-protocol", "crates/codex-protocol", "crates/foundation", "crates/daemon-support", "crates/system", "crates/daemon-engine", "crates/daemon-engine-model", "crates/store-sqlite", "crates/daemon-engine-machine", "crates/engine-kernel", "crates/engine-ports", "crates/engine-doubles", "crates/engine-github", "crates/github-gh", "crates/engine-live", "crates/engine-mcp", "crates/engine-worktrees", "crates/engine-orchestrator", "crates/engine-admission", "crates/engine-sdk", "crates/domain", "crates/store", "crates/provider-contract", "crates/agent-application", "crates/process-group", "crates/host", "crates/agent-runtime", "crates/provider-claude", "crates/provider-codex", "crates/provider-conformance", "crates/core", "crates/domain-rules", "crates/view-model", "crates/views", "crates/alondrad", "crates/alondra", "crates/e2e", "crates/relay", "crates/scenarios-transcript", "crates/scenarios", "crates/daemon-server", "crates/client-port", "crates/client-transport", "crates/cli", "crates/cli-tui", "crates/cli-mcp", "crates/cli-report"]

[workspace.package]
version = "0.3.68"
edition = "2024"
license = "Elastic-2.0"
publish = false

[workspace.dependencies]
alondra-agent-protocol = { path = "crates/agent-protocol" }
alondra-codex-protocol = { path = "crates/codex-protocol" }
alondra-foundation = { path = "crates/foundation" }
alondra-domain = { path = "crates/domain" }
alondra-store = { path = "crates/store" }
alondra-provider-contract = { path = "crates/provider-contract" }
alondra-agent-application = { path = "crates/agent-application" }
alondra-process-group = { path = "crates/process-group" }
alondra-host = { path = "crates/host" }
alondra-agent-runtime = { path = "crates/agent-runtime" }
alondra-provider-claude = { path = "crates/provider-claude" }
alondra-provider-codex = { path = "crates/provider-codex" }
alondra-provider-conformance = { path = "crates/provider-conformance" }
alondra-engine-doubles = { path = "crates/engine-doubles" }
alondra-core = { path = "crates/core" }
alondra-domain-rules = { path = "crates/domain-rules" }
alondra-view-model = { path = "crates/view-model" }
alondra-views = { path = "crates/views" }
alondra-daemon-server = { path = "crates/daemon-server" }
alondra-daemon-support = { path = "crates/daemon-support" }
alondra-system = { path = "crates/system" }
alondra-store-sqlite = { path = "crates/store-sqlite" }
alondra-daemon-engine-machine = { path = "crates/daemon-engine-machine" }
alondra-engine-kernel = { path = "crates/engine-kernel" }
alondra-engine-ports = { path = "crates/engine-ports" }
alondra-engine-github = { path = "crates/engine-github" }
alondra-github-gh = { path = "crates/github-gh" }
alondra-engine-live = { path = "crates/engine-live" }
alondra-engine-mcp = { path = "crates/engine-mcp" }
alondra-engine-worktrees = { path = "crates/engine-worktrees" }
alondra-engine-orchestrator = { path = "crates/engine-orchestrator" }
alondra-engine-admission = { path = "crates/engine-admission" }
alondra-engine-sdk = { path = "crates/engine-sdk" }
alondra-daemon-engine-model = { path = "crates/daemon-engine-model" }
alondra-daemon-engine = { path = "crates/daemon-engine" }
alondra-scenarios-transcript = { path = "crates/scenarios-transcript" }
alondra-e2e = { path = "crates/e2e" }
alondra-client-port = { path = "crates/client-port" }
alondra-client-transport = { path = "crates/client-transport" }
alondra-cli = { path = "crates/cli" }
alondra-cli-tui = { path = "crates/cli-tui" }
alondra-cli-mcp = { path = "crates/cli-mcp" }
alondra-cli-report = { path = "crates/cli-report" }
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
libc = "0.2.189"
notify = "8.2.0"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
ratatui = "0.30.2"
rpds = "1.2.1"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
mmdflux = { version = "2.6.1", default-features = false }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
ureq = { version = "3.4.2", default-features = false, features = ["json", "native-tls"] }

tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
