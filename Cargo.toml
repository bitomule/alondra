[workspace]
resolver = "3"
members = ["crates/agent-protocol", "crates/foundation", "crates/domain", "crates/store", "crates/provider-contract", "crates/agent-application", "crates/process-group", "crates/agent-runtime", "crates/provider-claude", "crates/core", "crates/alondrad", "crates/alondra", "crates/e2e", "crates/relay"]

[workspace.package]
version = "0.2.91"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
alondra-agent-protocol = { path = "crates/agent-protocol" }
alondra-foundation = { path = "crates/foundation" }
alondra-domain = { path = "crates/domain" }
alondra-store = { path = "crates/store" }
alondra-provider-contract = { path = "crates/provider-contract" }
alondra-agent-application = { path = "crates/agent-application" }
alondra-process-group = { path = "crates/process-group" }
alondra-agent-runtime = { path = "crates/agent-runtime" }
alondra-provider-claude = { path = "crates/provider-claude" }
alondra-core = { path = "crates/core" }
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
libc = "0.2.189"
notify = "8.2.0"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
ureq = { version = "3.4.2", default-features = false, features = ["json", "native-tls"] }

tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
