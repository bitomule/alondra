version: 1

# Brew, `make build/install/test/e2e-sandbox` and the tests all use the Bazel build. Every
# bazel/test check below joins one `bazel test` command, which waits once for the build;
# without --build_tests_only it also builds every non-test target of its packages, so no
# separate `bazel build` check is needed.
#
# A check's `paths` are the files its targets read, as Bazel reports them: a change to anything else
# (prose, images no test loads) reopens nothing. `make musts-scopes` fails when a path is missing or a
# glob matches nothing the targets read, and `tools/musts_scopes.py propose <check>` prints the paths
# Bazel asks for.
# musts-lint: allow glob-star-stops-at-slash
checks:
  crate-agent-application:
    uses: bazel/test
    paths:
      - ".bazelrc"
      - ".bazelversion"
      - "BUILD.bazel"
      - "Cargo.lock"
      - "Cargo.toml"
      - "MODULE.bazel"
      - "clippy.toml"
      - "crates/BUILD.bazel"
      - "crates/agent-application/**"
      - "crates/alondrad/**"
      - "crates/domain/**"
      - "crates/foundation/**"
      - "crates/provider-contract/**"
      - "crates/store/**"
      - "crates/test_support.rs"
      - "tools/BUILD.bazel"
      - "tools/rust_test.bzl"
      - "version.bzl"
    with:
      targets:
        - //crates/agent-application/...

  crate-agent-protocol:
