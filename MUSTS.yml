version: 1

# Brew ships with Cargo, so a crate dependency missing from a BUILD.bazel only breaks
# the Bazel build that `make build/install/test/e2e-sandbox` use. These checks run Bazel
# whenever a Rust source, manifest or build file changes.
checks:
  bazel-build:
    uses: bazel/build
    paths:
      - "crates/**"
      - "apple/**"
      - "launchd/**"
      - "**/*.bazel"
      - "MODULE.bazel"
      - ".bazelrc"
      - ".bazelversion"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
    with:
      target: //crates/...

  bazel-test:
    uses: bazel/test
    paths:
      - "crates/**"
      - "fixtures/**"
      - "launchd/**"
      - "**/*.bazel"
      - "MODULE.bazel"
      - ".bazelrc"
      - ".bazelversion"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
    with:
      targets:
        - //crates/...
