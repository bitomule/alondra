version: 1

# Brew ships with Cargo, so a crate dependency missing from a BUILD.bazel only breaks
# the Bazel build that `make build/install/test/e2e-sandbox` use. These checks run Bazel
# whenever a Rust source, manifest or build file changes.
checks:
  bazel-build:
    uses: bazel/build
    paths:
      - "crates/**"
      - "apple/**"
      - "launchd/**"
      - "**/*.bazel"
      - "MODULE.bazel"
      - ".bazelrc"
      - ".bazelversion"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
    with:
      target: //crates/...

  bazel-test:
    uses: bazel/test
    paths:
      - "crates/**"
      - "fixtures/**"
      - "launchd/**"
      - "**/*.bazel"
      - "MODULE.bazel"
      - ".bazelrc"
      - ".bazelversion"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "apple/**/*.xcstrings"
      - "apple/no_sleep_wording_test.sh"
    with:
      targets:
        - //crates/...
        - //apple:no_sleep_wording_test

  apple-tests:
    uses: bazel/test
    paths:
      - "apple/**"
      - "fixtures/views/**"
      - "**/*.bazel"
      - "MODULE.bazel"
      - ".bazelrc"
      - ".bazelversion"
    with:
      targets:
        - //apple/APIClient:AlondraViewsAPIClientTests
        - //apple/Auth:AlondraAuthTests
        - //apple/Data/Notifications:AlondraNotificationActionsTests
        - //apple/Data/PushBinding:AlondraPushBindingTests
        - //apple/Data/RelayOutbox:AlondraRelayOutboxTests
        - //apple/Data/Views:AlondraViewsDataTests
        - //apple/Demo:AlondraViewsDemoWorkspaceTests
        - //apple/Features/CloudPairing:AlondraCloudPairingFeatureTests
        - //apple/Features/Home:AlondraHomeFeatureTests
        - //apple/Features/Settings:AlondraSettingsFeatureTests
        - //apple/Features/ViewsDependency:AlondraViewsDependencyTests
        - //apple/Features/ViewsUI:AlondraViewsUITests
        - //apple/NotificationPayload:AlondraNotificationPayloadTests
        - //apple/ServicePairing:AlondraServicePairingTests
        - //apple/Testing:IssueReportingIntegrationTests
        - //apple/Views:AlondraViewsTests
        - //apple:AlondraMacServiceNavigationTests
        - //apple:AlondraMacWorkspaceOwnerTests
        - //apple:AlondraSharedTests
