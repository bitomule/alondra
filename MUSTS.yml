version: 1

# Brew, `make build/install/test/e2e-sandbox` and the tests all use the Bazel build. Every
# bazel/test check below joins one `bazel test` command, which waits once in the build queue;
# without --build_tests_only it also builds every non-test target of //crates/..., so no
# separate `bazel build` check is needed.
checks:
  bazel-test:
    uses: bazel/test
    paths:
      - "crates/**"
      - "fixtures/**"
      - "launchd/**"
      - "**/*.bazel"
      - "MODULE.bazel"
      - ".bazelrc"
      - ".bazelversion"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "Makefile"
      - "apple/**"
      - "plugin/**"
      - "tools/plugin-mod-test.sh"
      - "deploy/brew/**"
      - "deploy/apple/**"
      - "deploy/pi/**"
      - "tools/shared.bzl"
      - "tests/system/macos/**"
    with:
      targets:
        - //crates/...
        - //tests/system/macos:local_daemon_test
        - //apple:no_sleep_wording_test
        - //apple:release_bonjour_test
        - //apple:spanish_catalog_test
        - //apple:unused_catalog_strings_test
        - //apple:push_keychain_group_test
        - //apple:update_keeps_session_test
        - //:plugin_mod_test
        - //deploy/brew:plugin_payload_test
        - //deploy/brew:upgrade_rehearsal_test
        - //deploy/apple:prepare_test
        - //deploy/apple:increment_version_test
        - //deploy/apple:version_guard_test
        - //deploy/pi/iroh-relay:relay_access_test
        - //deploy/pi:pi_ssh_test

  sdk-host:
    uses: bazel/test
    paths:
      - "agent-host/**"
    with:
      targets:
        - //agent-host:sdk_test
        - //agent-host:release_host
        - //agent-host:sea_test
        - //agent-host:frame_test
        - //agent-host:ownership_test
        - //agent-host:journal_test
        - //agent-host:journal_compaction_test
        - //agent-host:channel_test
        - //agent-host:sdk_cleanup_test
        - //agent-host:host_stop_test
        - //agent-host:sdk_descendant_test
        - //agent-host:host_flush_test
        - //agent-host:sdk_retry_test
        - //agent-host:sdk_orchestrator_test
        - //agent-host:reconcile_test
        - //agent-host:sdk_worker_test
        - //agent-host:controls_test
        - //agent-host:decisions_test
        - //agent-host:codex_session_test
        - //agent-host:model_probe_test
        - //agent-host:umask_test
        - //agent-host:probe_test

  # The brew release builds with Cargo: a crate a production Bazel target links must also be
  # a normal dependency in its Cargo.toml, or Bazel passes and the release fails.
  cargo-bazel-deps:
    uses: bazel/test
    paths:
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - "crates/**/BUILD.bazel"
      - "crates/cargo_bazel_deps_test.py"
    with:
      targets:
        - //crates:cargo_bazel_deps_test

  apple-tests:
    uses: bazel/test
    paths:
      - "apple/**"
      - "fixtures/views/**"
      - "fixtures/push/**"
      - "**/*.bazel"
      - "MODULE.bazel"
      - ".bazelrc"
      - ".bazelversion"
    with:
      targets:
        - //apple/Contract:AlondraContractTests
        - //apple/Data/Transport:AlondraTransportTests
        - //apple/Data/Account:AlondraAccountTests
        - //apple/Data/Pairing:AlondraPairingTests
        - //apple/Data/Notifications:AlondraNotificationsTests
        - //apple/Data/Feed:AlondraFeedTests
        - //apple/Data/Feed:ActionJournalProcessTests
        - //apple/Data/Iroh:AlondraIrohProcessTests
        - //apple/Data/Attachments:AlondraAttachmentsTests
        - //apple/Demo:AlondraDemoTests
        - //apple/Design:AlondraDesignTests
        - //apple/Mermaid:AlondraMermaidTests
        - //apple/Mermaid:AlondraMermaidSnapshotTests
        - //apple/Features:AlondraFeaturesTests
        - //apple/Testing:TemporaryFilesTests
        - //apple/Testing:IssueReportingIntegrationTests
        - //apple/Testing/Quality:AlondraQualityTests
        - //apple/Testing/Snapshots:AlondraSnapshotTests
        - //apple/Testing/TriageTouch:TriageTouchUITests
        - //apple/Testing/MacSnapshots:AlondraMacSnapshotTests
        - //apple:AlondraMacServiceNavigationTests
        - //apple:AlondraMacWorkspaceOwnerTests
        - //apple:mac_app_build_test

  load-bench-oracles:
    uses: bazel/test
    paths:
      - "tools/load_bench.py"
      - "tools/tests/test_load_bench.py"
    with:
      targets:
        - //tools:load_bench_test

  bazel-speed:
    uses: bazel/test
    paths:
      - "tools/bazel_speed.py"
      - "tools/tests/test_bazel_speed.py"
    with:
      targets:
        - //tools:bazel_speed_test

  buildbuddy-credential-helper:
    uses: bazel/test
    paths:
      - "tools/buildbuddy-credential-helper.sh"
      - "tools/tests/test_buildbuddy_credential_helper.py"
    with:
      targets:
        - //tools:buildbuddy_credential_helper_test

  bazel-test-tmpdir:
    uses: bazel/test
    paths:
      - "tools/test-tmpdir.sh"
      - "tools/tests/test_bazel_test_tmpdir.py"
    with:
      targets:
        - //tools:bazel_test_tmpdir_test

  native-fixture-lifecycle:
    uses: bazel/test
    paths:
      - "tests/native/**"
      - "agent-host/descendant-fake-claude.py"
      - "agent-host/BUILD.bazel"
      - "MODULE.bazel"
    with:
      targets:
        - //tests/native/claude:client_lifecycle_test
