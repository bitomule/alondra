version: 1

# Brew ships with Cargo, so a crate dependency missing from a BUILD.bazel only breaks
# the Bazel build that `make build/install/test/e2e-sandbox` use. These checks run Bazel
# whenever a Rust source, manifest or build file changes.
checks:
  bazel-build:
    uses: bazel/build
    paths:
      - "crates/**"
      - "apple/**"
      - "launchd/**"
      - "**/*.bazel"
      - "MODULE.bazel"
      - ".bazelrc"
      - ".bazelversion"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
    with:
      target: //crates/...

  bazel-test:
    uses: bazel/test
    paths:
      - "crates/**"
      - "fixtures/**"
      - "launchd/**"
      - "**/*.bazel"
      - "MODULE.bazel"
      - ".bazelrc"
      - ".bazelversion"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "apple/**/*.xcstrings"
      - "apple/no_sleep_wording_test.sh"
      - "apple/release_bonjour_test.sh"
      - "apple/Bonjour/*.plist"
      - "apple/push_keychain_group_test.py"
      - "apple/update_keeps_session_test.py"
      - "apple/**/*.entitlements"
      - "apple/**/Info.plist"
      - "plugin/**"
      - "tools/plugin-mod-test.sh"
      - "deploy/brew/**"
    with:
      targets:
        - //crates/...
        - //apple:no_sleep_wording_test
        - //apple:release_bonjour_test
        - //apple:spanish_catalog_test
        - //apple:push_keychain_group_test
        - //apple:update_keeps_session_test
        - //:plugin_mod_test
        - //deploy/brew:plugin_payload_test

  apple-tests:
    uses: bazel/test
    paths:
      - "apple/**"
      - "fixtures/views/**"
      - "fixtures/push/**"
      - "**/*.bazel"
      - "MODULE.bazel"
      - ".bazelrc"
      - ".bazelversion"
    with:
      targets:
        - //apple/Contract:AlondraContractTests
        - //apple/Data/Transport:AlondraTransportTests
        - //apple/Data/Account:AlondraAccountTests
        - //apple/Data/Pairing:AlondraPairingTests
        - //apple/Data/Notifications:AlondraNotificationsTests
        - //apple/Data/Feed:AlondraFeedTests
        - //apple/Data/Attachments:AlondraAttachmentsTests
        - //apple/Demo:AlondraDemoTests
        - //apple/Design:AlondraDesignTests
        - //apple/Features:AlondraFeaturesTests
        - //apple/Testing:IssueReportingIntegrationTests
        - //apple/Testing/Snapshots:AlondraSnapshotTests
        - //apple/Testing/MacSnapshots:AlondraMacSnapshotTests
        - //apple:AlondraMacServiceNavigationTests
        - //apple:AlondraMacWorkspaceOwnerTests
