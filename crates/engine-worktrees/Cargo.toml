[features]
test-hooks = ["dep:tempfile", "alondra-daemon-support/test-hooks", "alondra-engine-kernel/test-hooks"]

[dependencies]
alondra-core.workspace = true
alondra-daemon-support.workspace = true
alondra-engine-kernel.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tempfile = { workspace = true, optional = true }
