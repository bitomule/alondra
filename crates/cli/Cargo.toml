[package]
name = "alondra-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alondra-client-port.workspace = true
alondra-core.workspace = true
alondra-host.workspace = true
alondra-spec-engine.workspace = true
alondra-domain-rules.workspace = true
alondra-e2e.workspace = true
alondra-view-model.workspace = true
anyhow.workspace = true
base64 = "0.23.1"
clap.workspace = true
cliclack = "0.5.6"
crossterm.workspace = true
libc.workspace = true
p256 = { version = "0.14.0", features = ["ecdsa", "pem", "pkcs8"] }
qrcode = { version = "0.14.1", default-features = false }
ring = "0.17.14"
rusqlite.workspace = true
security-framework = "3.7.0"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
subtle = "2.6.1"
tempfile.workspace = true
toml.workspace = true
ureq.workspace = true
url = "2.5.7"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["alloc", "NSString", "NSURL"] }

[dev-dependencies]
alondra-client-transport.workspace = true
