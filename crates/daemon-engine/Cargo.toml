[package]
name = "alondra-daemon-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-hooks = ["dep:tempfile", "alondra-daemon-engine-model/test-hooks", "alondra-daemon-support/test-hooks"]

[dependencies]
alondra-agent-application.workspace = true
alondra-agent-runtime.workspace = true
alondra-core.workspace = true
alondra-daemon-engine-model.workspace = true
alondra-daemon-support.workspace = true
alondra-domain.workspace = true
alondra-foundation.workspace = true
alondra-process-group.workspace = true
alondra-provider-claude.workspace = true
alondra-provider-codex.workspace = true
alondra-provider-contract.workspace = true
alondra-store.workspace = true
anyhow.workspace = true
axum.workspace = true
base64 = "0.23.1"
libc.workspace = true
p256 = { version = "0.14.0", features = ["ecdsa", "pem", "pkcs8"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "json"] }
ring = "0.17.14"
rusqlite = { workspace = true, features = ["backup"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
sysinfo.workspace = true
tempfile = { workspace = true, optional = true }
tokio.workspace = true
toml.workspace = true
url = "2.5"

[dev-dependencies]
alondra-codex-protocol.workspace = true
alondra-daemon-engine-model = { workspace = true, features = ["test-hooks"] }
alondra-daemon-support = { workspace = true, features = ["test-hooks"] }
proptest.workspace = true
tempfile.workspace = true
