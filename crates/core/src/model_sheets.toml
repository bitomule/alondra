provider = "codex"
match = "gpt-6.1-sol"
cost = "medium"
good_for = ["fix", "tests", "migration", "refactor", "review", "docs"]
cautions = "Below the Claude Code runs on TB4 (58.2%)"
evidence = "TB4: Codex + GPT-6.1 Sol 58.2% at $1.92/task. AIDev: Codex accepted 59.6-88.6% across all 9 categories. Warp: Codex for mechanical migrations and test backfill"

