# spec: antigravity.signed-out/no-other-host-while-signed-out
name = "an antigravity account that is not signed in holds its task on a card that says how to sign in, and starts no other host"
max_virtual = "30m"

[[step]]
do = "request"
text = "Export the report as CSV"
task = "t1"
title = "Add the CSV export"

[[step]]
do = "antigravity_node"
task = "t1"
transcripts = ["sign-in-refused.ndjson"]

[[step]]
do = "rest"
max = "10m"

[[step]]
do = "checkpoint"
name = "signed-out"
screens = ["home", "tasks", "task:t1"]
pushes = true

[[step.expect]]
check = "transcripts_played"

[[step.expect]]
check = "view_shows"
screen = "home"
text = "Sign in to Antigravity outside Alondra"
