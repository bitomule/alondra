name = "a delivery whose pull request merged closes at once, though the usage limit holds its node and keeps the request to clean up from it"
fixes = "#227"
max_virtual = "2h"

[[step]]
do = "request"
text = "Export the report as CSV"
task = "t1"
title = "Add the CSV export"

[[step]]
do = "node"
task = "t1"

[[step]]
do = "github"
event = "open_pr"
number = 7
head = "csv-export"
base = "main"

[[step]]
do = "register_pr"
task = "t1"
number = 7

[[step]]
do = "present"
task = "t1"
id = "d1"
prs = [7]
body = "The CSV export is ready"

[[step]]
do = "turn_end"
task = "t1"

[[step]]
do = "provider_down"
error = "rate_limit"
status = 429

[[step]]
do = "press"
presentation = "d1"
action = "merge"

[[step]]
do = "rest"
max = "10m"

[[step]]
do = "checkpoint"
name = "closed"
pushes = true

[[step.expect]]
check = "badge"
count = 0

[[step.expect]]
check = "pr_merged_into"
pr = 7
branch = "main"

[[step.expect]]
check = "task_state"
task = "t1"
state = "done"
