name = "large conversations the usage limit held past their prompt cache go on in new sessions, which write little to the cache, though the request that hit the limit answered with no tokens"
max_virtual = "6h"

[[step]]
do = "request"
text = "Write the release notes"
task = "t1"
title = "Write the release notes"

[[step]]
do = "node"
task = "t1"
model = "demo-model"

[[step]]
do = "conversation"
task = "t1"
tokens = 250000

[[step]]
do = "turn_end"
task = "t1"

[[step]]
do = "request"
text = "Write the migration guide"
task = "t2"
title = "Write the migration guide"

[[step]]
do = "node"
task = "t2"
model = "demo-model"

[[step]]
do = "conversation"
task = "t2"
tokens = 180000

[[step]]
do = "turn_end"
task = "t2"

[[step]]
do = "provider_down"
error = "rate_limit"
status = 429

[[step]]
do = "tell"
task = "t1"
text = "Add the changelog too"

[[step]]
do = "turn_end"
task = "t1"

[[step]]
do = "tell"
task = "t2"
text = "Cover the config changes too"

[[step]]
do = "turn_end"
task = "t2"

[[step]]
do = "rest"
max = "10m"

[[step]]
do = "checkpoint"
name = "held-by-the-limit"
screens = ["task:t1"]

[[step.expect]]
check = "view_shows"
screen = "task:t1"
text = "Claude limit"

[[step]]
do = "advance"
by = "30m"

[[step]]
do = "provider_up"

[[step]]
do = "advance"
by = "3h"

[[step]]
do = "rest"
max = "10m"

[[step]]
do = "checkpoint"
name = "a-new-session-goes-on"

[[step.expect]]
check = "hosts"
task = "t1"
started = 3
running = 1
sessions = 2

[[step.expect]]
check = "cache_written"
task = "t1"
max = 20000

[[step.expect]]
check = "hosts"
task = "t2"
started = 3
running = 1
sessions = 2

[[step.expect]]
check = "cache_written"
task = "t2"
max = 20000
