name = "a daemon that restarts between the approval of a staged task's plan and the end of the author's turn still starts exactly one implementer, in a new session, once the author rests"
max_virtual = "2h"

[[step]]
do = "request"
text = "Stream the CSV export instead of building it in memory"
task = "t1"
title = "Stream the CSV export"

[[step]]
do = "node"
task = "t1"
model = "demo-model"
stages = true

[[step]]
do = "rest"
max = "5m"

[[step]]
do = "plan"
task = "t1"
request = "author-plan"
plan = "# Stream the CSV export\n\n- [ ] Write rows to the response as they are read\n- [ ] Test an export larger than memory"

[[step]]
do = "rest"
max = "5m"

[[step]]
do = "press"
presentation = "decision-t1-1-6"
action = "accept"
screen = "home"

[[step]]
do = "restart"

[[step]]
do = "rest"
max = "10m"

[[step]]
do = "checkpoint"
name = "author-taken-over"

[[step.expect]]
check = "answered"
task = "t1"
request = "author-plan"
answer = "deny"

[[step.expect]]
check = "view_shows"
screen = "task:t1"
text = "Implementer · starting once the current agent rests"

[[step.expect]]
check = "hosts"
task = "t1"
started = 1
running = 1
sessions = 1

[[step]]
do = "turn_end"
task = "t1"

[[step]]
do = "rest"
max = "10m"

[[step]]
do = "checkpoint"
name = "implementer-started"

[[step.expect]]
check = "hosts"
task = "t1"
started = 2
running = 1
sessions = 2

[[step.expect]]
check = "view_shows"
screen = "task:t1"
text = "2. Implementer"

[[step]]
do = "advance"
by = "5m"

[[step]]
do = "rest"
max = "10m"

[[step]]
do = "checkpoint"
name = "still-one-implementer"

[[step.expect]]
check = "hosts"
task = "t1"
started = 2
running = 1
sessions = 2

[[step.expect]]
check = "view_shows"
screen = "task:t1"
text = "3. Implementer"
present = false

[[step.expect]]
check = "task_state"
task = "t1"
state = "running"
