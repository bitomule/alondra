[package]
name = "alondra-scenarios"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alondra = { path = "../alondra" }
alondrad = { path = "../alondrad" }
alondra-agent-protocol.workspace = true
alondra-agent-runtime.workspace = true
alondra-core.workspace = true
alondra-daemon-engine.workspace = true
alondra-daemon-support.workspace = true
alondra-engine-admission.workspace = true
alondra-engine-doubles.workspace = true
alondra-engine-kernel.workspace = true
alondra-engine-ports.workspace = true
alondra-store-sqlite.workspace = true
alondra-engine-sdk.workspace = true
alondra-domain-model.workspace = true
alondra-view-model.workspace = true
alondra-views.workspace = true
alondra-engine-orchestrator.workspace = true
alondra-scenarios-transcript.workspace = true
anyhow.workspace = true
base64 = "0.23.1"
libc.workspace = true
p256 = { version = "0.14.0", features = ["ecdsa", "pem", "pkcs8"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true

[[bin]]
name = "accept"
