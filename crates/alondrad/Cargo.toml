[package]
name = "alondrad"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alondra-process-group.workspace = true
alondra-core.workspace = true
alondra-e2e = { path = "../e2e" }
alondra-agent-application.workspace = true
alondra-agent-runtime.workspace = true
alondra-domain.workspace = true
alondra-foundation.workspace = true
alondra-provider-claude.workspace = true
alondra-provider-contract.workspace = true
alondra-store.workspace = true
anyhow.workspace = true
axum.workspace = true
base64 = "0.23.1"
iroh = { version = "1.3.0", features = ["unstable-net-report"] }
n0-future = "0.3.2"
portmapper = "0.19.3"
netwatch = "0.19.3"
libc.workspace = true
notify.workspace = true
p256 = { version = "0.14.0", features = ["ecdsa", "pem", "pkcs8"] }
ring = "0.17.14"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "json"] }
url = "2.5"
rusqlite = { workspace = true, features = ["backup"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
sysinfo.workspace = true
tokio.workspace = true
toml.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "libc", "objc2"] }
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSDate", "NSError", "NSTimeZone", "NSNotification", "NSString", "NSOperation", "NSURL", "NSValue", "block2"] }

[dev-dependencies]
h2 = "0.4.19"
proptest.workspace = true
tempfile.workspace = true

[[bin]]
name = "alondrad"
path = "src/main.rs"

[[bin]]
name = "alondrad-launcher"
path = "launcher/main.rs"
