[package]
name = "alondrad"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alondra-core.workspace = true
alondra-e2e = { path = "../e2e" }
anyhow.workspace = true
axum.workspace = true
base64 = "0.23.1"
libc.workspace = true
notify.workspace = true
p256 = { version = "0.14.0", features = ["ecdsa", "pem", "pkcs8"] }
ring = "0.17.14"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "json"] }
url = "2.5"
rusqlite = { workspace = true, features = ["backup"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
sysinfo.workspace = true
tokio.workspace = true
toml.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "libc", "objc2"] }
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSDate", "NSTimeZone", "NSNotification", "NSString", "NSOperation", "block2"] }

[dev-dependencies]
tempfile.workspace = true
