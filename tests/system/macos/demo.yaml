name: alondra-macos-clean-demo
steps:
  - open: { skipBuild: true }
  - wait: { text: Explore the demo, timeout: 30s }
  - video.start: {}
  - evidence.step: { name: clean-onboarding, note: A new VM reaches onboarding without a saved account. }
  # The banner is unindexed AXStaticText; MAV text waits see indexed controls.
  # validate_report checks the literal banner in the preserved raw AX states.
  # MAV may fall back to an unconfirmed click after a stale element token.
  # Re-resolve the selector and require the destination, never tap exit 0.
  - whileNotVisible:
      text: Reset demo
      timeout: 90s
      do:
        - tap: { text: Explore the demo }
        - delay: 500ms
  - wait: { text: Reset demo, timeout: 10s }
  - wait: { text: "Which welcome screen should we use?", timeout: 10s }
  - evidence.step: { name: demo-open, note: The app opens the sample workspace without account login. }
  - tap: { text: Reset demo }
  - wait: { text: Reset demo, timeout: 20s }
  - wait: { text: "Which welcome screen should we use?", timeout: 10s }
  - evidence.step: { name: demo-reset, note: Reset returns to the sample workspace and retains its demo banner. }
  - tap: { text: Exit demo }
  - wait: { text: Explore the demo, timeout: 20s }
  - evidence.step: { name: demo-exit, note: Leaving demo returns to the account onboarding entry. }
  - video.stop: { note: "Fresh launch, enter demo, reset and exit in a disposable VM." }
  - crashes: {}
  - report: {}
